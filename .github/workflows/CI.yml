# Runs only when started by hand (`gh workflow run CI`, or the Actions tab): a clean-checkout check,
# e.g. before submitting the paper. Every change is tested locally before it is committed.
on:
  workflow_dispatch:

name: CI

jobs:
  CI:
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        version:
          - '1.12'
          # - 'nightly'
        os:
          - ubuntu-24.04
        arch:
          - x64

    # No R: the R comparison (test/test-gwmodel.jl) needs a gitignored fixture, so CI skips it.
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.version }}
          arch: ${{ matrix.arch }}
      - uses: julia-actions/cache@v3
      - uses: julia-actions/julia-buildpkg@v1
      # - run: |
      #     git config --global user.name Tester
      #     git config --global user.email te@st.er

      - uses: julia-actions/julia-runtest@v1
        with:
          coverage: false
        continue-on-error: ${{ matrix.version == 'nightly' }}
