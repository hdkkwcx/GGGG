outputs = ["data/processed/hubei_fy4b_hourly_2022_2024_full_strict_navcorrected.csv"]
note = "reads the FY4B files in data/FY4B/"

[[step]]
id = "raw_fy4b"
kind = "data"
command = []
outputs = ["data/FY4B"]
note = """no tracked script downloads them (NSMC's FengYun data service). FY-4B AGRI L2 QPE, \
full disk, 4 km, one file per 15-min scan (`..._L2-_QPE-_MULT_NOM_<start>_<end>_4000M_V0001.NC`), \
2022-2024, on the external drive at /Volumes/T9/FY4B and linked as data/FY4B. The 1-, 3- and 24-h \
QPE files are corrected with China's rain gauges and are never read."""

[[step]]
id = "raw_fy4b_clt"
kind = "data"
command = []
outputs = ["data/FY4B_CLT"]
note = """no tracked script downloads them (NSMC's FengYun data service). FY-4B AGRI L2 CLT (cloud \
type), full disk, 4 km, every 15 min, July 2023 only, on the external drive at /Volumes/T9/CLT and \
linked as data/FY4B_CLT. Kept out of data/FY4B, where the QPE reader would take each file for a \
duplicate of its QPE quarter."""

[[step]]
