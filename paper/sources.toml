# Numbers the paper cites. `scripts/export_paper_numbers.py` writes each block to
# paper/numbers/<name>.json, which paper_plan.typ reads; the check re-exports them and fails on any
# difference. `values` maps an output name to [source column, format]: 3f / 2f decimals, or
# pct1 / pct0, a fraction as a signed percentage. Uncal blocks are the primary run, Final blocks the
# IMERG Final sensitivity run.

[[table]]
name = "methods_uncal"
label = "Table 3 and RQ3 text: pooled metrics (IMERG Uncal)"
source = "output/gauge_satellite_fusion_nofy4b_gpmuncal/method_summary.csv"
provenance = [
    "output/gauge_satellite_fusion_nofy4b_gpmuncal/source_provenance.csv",
    "output/interpolation_benchmark_full_joint_covariates_nested_mgwrintercept_only_satwetblend_blendagrenv_fusedanchor_nofy4b_gpmuncal/benchmark_scope.csv",
]
keys = ["product", "method"]
[table.where]
scheme = "balanced_spatial"
method = ["adw", "idw", "tps", "gwr", "raw", "mgwr", "blend_agrenv_mgwr"]
[table.values]
RMSE = ["RMSE", "3f"]
r = ["r", "3f"]
CSI2 = ["CSI_2.0", "3f"]
vs_raw = ["RMSE_improvement_vs_raw", "pct1"]
vs_adw = ["RMSE_improvement_vs_adw", "pct1"]
vs_raw0 = ["RMSE_improvement_vs_raw", "pct0"]
vs_adw0 = ["RMSE_improvement_vs_adw", "pct0"]

