# The benchmark run predates the `command` row, so its command was rebuilt from the run folder
# name. Checked on 2026-10-21: parsed by run_interpolation_benchmark.jl's own `main` (stopped
# before the run), it yields the run's folder and benchmark_scope.csv settings, and the settings
# line it prints is identical to the one the run wrote into
# output/full_benchmark_fusedanchor_nofy4b_gpmuncal.log.
[[step]]
id = "benchmark"
kind = "analysis"
reviewed = "6cc2f6952f16f0eb8614e00837f869229b88aaef"
command = ["julia", "-t", "4", "--project=.", "scripts/run_interpolation_benchmark.jl", "full",
           "--nested-covariates", "--satellite-wet-blend", "--blend-axis", "agreement_envelope",
           "--fused-anchor"]
