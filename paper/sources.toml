# RQ1: the six heavy-rain events (IMERG Uncal run).

[[table]]
name = "rq1_summary"
label = "RQ1 text: mean over the six events (IMERG Uncal)"
step = "rq1_events"
source = "output/heavy_rain_events_gpm_gsmap_gpmuncal/event_metrics_summary.csv"
provenance = ["output/heavy_rain_events_gpm_gsmap_gpmuncal/provenance.csv"]
keys = ["product"]
[table.where]
window = "full_day"
statistic = "mean_over_events"
[table.values]
r = ["r", "2f"]
MB = ["Bias", "+1f"]
RMSE = ["RMSE", "1f"]

[[table]]
name = "rq1_events"
label = "RQ1 text: scores per event (IMERG Uncal)"
step = "rq1_events"
source = "output/heavy_rain_events_gpm_gsmap_gpmuncal/event_metrics.csv"
provenance = ["output/heavy_rain_events_gpm_gsmap_gpmuncal/provenance.csv"]
keys = ["event_day", "event_type", "product"]
[table.where]
window = "full_day"
[table.values]
r = ["r", "2f"]
MB0 = ["Bias", "+0f"]
CSI50 = ["CSI_50", "2f"]
# Over both products: the four events other than 2022-06-26 and 2023-08-26, and 2022-06-26.
[table.stats.r_four]
stat = "range"
column = "r"
fmt = "2f"
where = { event_day = ["2022-10-03", "2023-06-17", "2023-09-10", "2024-07-30"], product = ["GPM_uncal", "GSMaP"] }
[table.stats.r_0626_max]
stat = "max"
column = "r"
fmt = "2f"
where = { event_day = "2022-06-26", product = ["GPM_uncal", "GSMaP"] }

[[table]]
name = "rq1_cores"
label = "RQ1 text: storm-core deficit per event and product"
step = "rq1_cores"
source = "output/heavy_core_diagnostics_gpmuncal/summary.csv"
provenance = ["output/heavy_core_diagnostics_gpmuncal/provenance.csv"]
keys = ["event_day", "event_type", "product"]
[table.values]
repr = ["representativeness_share", "pct0"]
top3 = ["median_top3_share_of_obs", "pct0"]
peak_ratio = ["median_peak_ratio", "2f"]
# Over the two localized events and both products (IMERG Final excluded).
[table.stats.repr_local]
stat = "range"
column = "representativeness_share"
fmt = "pct0"
where = { event_type = "localized", product = ["GPM_uncal", "GSMaP"] }
[table.stats.top3_local_max]
stat = "max"
column = "median_top3_share_of_obs"
fmt = "pct0"
where = { event_type = "localized", product = ["GPM_uncal", "GSMaP"] }
[table.stats.peak_ratio_local]
stat = "range"
column = "median_peak_ratio"
fmt = "2f"
where = { event_type = "localized", product = ["GPM_uncal", "GSMaP"] }

[[table]]
name = "rq1_core_gauges"
label = "RQ1 text: peak hourly rain at the core gauges of the localized events"
step = "rq1_cores"
source = "output/heavy_core_diagnostics_gpmuncal/core_gauges.csv"
provenance = ["output/heavy_core_diagnostics_gpmuncal/provenance.csv"]
[table.where]
event_type = "localized"
[table.stats.peak_0910]
stat = "median"
column = "obs_peak_mm_h"
fmt = "0f"
where = { event_day = "2023-09-10" }
[table.stats.peak_0730]
stat = "median"
column = "obs_peak_mm_h"
fmt = "0f"
where = { event_day = "2024-07-30" }

[[table]]
name = "rq1_phases"
label = "RQ1 text: spatial r of each 8 h phase"
step = "rq1_cores"
source = "output/heavy_core_diagnostics_gpmuncal/phase_decomposition.csv"
provenance = ["output/heavy_core_diagnostics_gpmuncal/provenance.csv"]
keys = ["event_day", "phase", "product"]
[table.where]
phase = ["1", "2", "3"]
[table.values]
r = ["r", "2f"]
[table.stats.r_0626]
stat = "range"
column = "r"
fmt = "2f"
where = { event_day = "2022-06-26", product = ["GPM_uncal", "GSMaP"] }


# RQ2: hourly evaluation over the full 2022-2024 record (IMERG Uncal run without FY4B).

[[table]]
name = "rq2_classes"
label = "RQ2 text: scores by intensity class, season and relief"
step = "rq2"
source = "output/satellite_temporal_evaluation_nofy4b_gpmuncal_block7d/intensity_class_metrics.csv"
provenance = ["output/satellite_temporal_evaluation_nofy4b_gpmuncal_block7d/provenance.csv"]
keys = ["product", "season", "region", "gauge_class"]
[table.where]
sample = "gpm_gsmap_full"
region = ["all", "relief_lt500", "relief_500_1000"]
[table.values]
RB0 = ["RB_pct", "+0f"]
POD = ["POD_rain", "pct0"]
hit = ["class_hit", "pct0"]
# At >= 8 mm/h (the rainstorm and severe classes), all seasons, both products.
[table.stats.loss_heavy]
stat = "range"
abs = true
column = "RB_pct"
fmt = "0f"
where = { product = ["GPM_uncal", "GSMaP"], season = "all", region = "all", gauge_class = ["rainstorm", "severe_rainstorm"] }
[table.stats.hit_heavy_max]
stat = "max"
column = "class_hit"
fmt = "pct0"
where = { product = ["GPM_uncal", "GSMaP"], season = "all", region = "all", gauge_class = ["rainstorm", "severe_rainstorm"] }
# The largest class-bias difference between relief below 500 m and 500-1000 m, per product and class.
[table.stats.relief_gap_max]
stat = "maxgap"
column = "RB_pct"
fmt = "0f"
key = "region"
a = "relief_lt500"
b = "relief_500_1000"
by = ["product", "gauge_class"]
where = { product = ["GPM_uncal", "GSMaP"], season = "all", gauge_class = ["light", "moderate", "heavy", "rainstorm", "severe_rainstorm"] }

[[table]]
name = "rq2_events"
label = "RQ2 text: rain-event detection and timing"
step = "rq2"
source = "output/satellite_temporal_evaluation_nofy4b_gpmuncal_block7d/event_timing_summary.csv"
provenance = ["output/satellite_temporal_evaluation_nofy4b_gpmuncal_block7d/provenance.csv"]
keys = ["product", "event_class"]
[table.where]
sample = "gpm_gsmap_full"
season = "all"
region = "all"
min_dry_gap_h = "3"
event_class = ["moderate", "heavy", "rainstorm", "severe_rainstorm"]
[table.values]
POD = ["POD_event", "pct0"]
centroid = ["median_centroid_error_h", "1f"]
[table.stats.pod]
stat = "range"
column = "POD_event"
fmt = "pct0"
where = { product = ["GPM_uncal", "GSMaP"] }
[table.stats.centroid_min]
stat = "min"
column = "median_centroid_error_h"
fmt = "1f"
where = { product = ["GPM_uncal", "GSMaP"] }
[table.stats.centroid_max]
stat = "max"
column = "median_centroid_error_h"
fmt = "1f"
where = { product = ["GPM_uncal", "GSMaP"] }

[[table]]
name = "rq2_areal"
label = "RQ2 text: areal-mean series"
step = "rq2"
source = "output/satellite_temporal_evaluation_nofy4b_gpmuncal_block7d/regional_series_metrics.csv"
provenance = ["output/satellite_temporal_evaluation_nofy4b_gpmuncal_block7d/provenance.csv"]
