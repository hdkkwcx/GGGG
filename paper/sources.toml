kind = "data"
command = []
outputs = ["paper/fy4b_tries.csv"]
note = """kept by hand, not by a script, and tracked in paper/ (the one CSV .gitignore lets through): \
the paper's words-only version of Projects_Pending_Handover/fy4b_tries.md, which holds each try's \
numbers and commits. Add a row to both when a FY4B fix is tried."""

