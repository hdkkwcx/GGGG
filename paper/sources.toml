[[step]]
id = "benchmark"
kind = "analysis"
# Run at fe421b3; reviewed at 079ed3f: that diff adds the matched-sample diagnostics, the RQ1/RQ2
# options and two option helpers in TimeBlockFolds, none of which the benchmark calls. Reviewed
# again at 2e9d832: that diff adds the opt-in --fy4b-qm-crossed (SatelliteCalibration
# .calibrate_crossed), which this run does not use. Without it, a smoke run reproduces the earlier
# code's FY4B_QM, FY4B, GPM_uncal and GSMaP fields byte for byte. Reviewed again at b044b3f: that
# diff adds the opt-in --fy4b-confirm-fusion (SatelliteFusion.confirmed_by_others, read through
# _fusion_source_matrices), which this run does not use. Without it, a paper-config smoke run
# reproduces the earlier code's run in every file but the git rows of benchmark_scope.csv.
reviewed = "b044b3fc32c8aa50ec14b9f46ed247a479619f4d"
command = ["julia", "-t", "4", "--project=.", "scripts/run_interpolation_benchmark.jl", "full",
           "--nested-covariates", "--satellite-wet-blend", "--blend-axis", "agreement_envelope",
           "--fused-anchor", "--with-fy4b", "--fy4b-file", "output/fy4b_rebuild_2022_2024/fy4b_w3_h0.csv",
           "--fy4b-qm", "--fy4b-qm-adaptive"]
marker = "output/interpolation_benchmark_full_joint_covariates_nested_mgwrintercept_only_satwetblend_blendagrenv_fusedanchor_fy4bw3h0_fy4bqm_fy4bqmadapt_gpmuncal/benchmark_scope.csv"
