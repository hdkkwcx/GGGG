[table.values]
change = ["RMSE_improvement_vs_adw", "pct1"]
change0 = ["RMSE_improvement_vs_adw", "pct0"]
bias = ["Bias", "1f"]

[[table]]
name = "merge_uncal"
label = "RQ3 text: OLS merge weights (IMERG Uncal)"
