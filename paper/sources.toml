# Where every figure in paper/figures/ and every table in paper_plan.typ comes from.
# `scripts/check_paper_provenance.py` reads this file and checks each entry:
#   - `source` exists, and the `paper` copy is byte-identical to it (figures only);
#   - every `provenance` file records git_dirty=false (and git_dirty_at_end / report_git_dirty
#     =false where present), so a commit reproduces it;
#   - every input_sha256:<path> a run recorded still matches that file in data/.
# Paths are relative to the repository root. Update an entry when a figure is re-copied from a
# different output.
# RQ1-RQ3 compare FY4B (the rebuilt series of §2.5, fy4b_w3_h0), GPM (IMERG Uncal, `_gpmuncal`) and
# GSMaP on one matched sample from June 2022: RQ1 and RQ2 run with `--fy4b-file ... --from 2022-06`
# (RQ2's `all_products` sample), and RQ3 and §3.4 rescore the FY4B benchmark run with
# `--matched-products`.

