# How each output above is made: the dependency graph `scripts/make_paper.jl` walks. Every entry
# names its `step`. A step's `command` runs from the repository root ("julia" is the running Julia,
# "python" the interpreter make_paper.jl resolves). An analysis or figure step is reused while its
# `marker` exists and, when the marker is a provenance file, records a clean tree and unchanged
# inputs. Data steps write `data/`, so make_paper.jl only checks their `outputs` and prints their
# command; it never runs them. `note` records what the command alone does not reproduce.
# `reviewed` is a commit up to which code changes since a step's run were checked and found not to
# move its result (make_paper.jl reports later ones as CHANGED); bump it only after such a review.

[[step]]
id = "prep_satellite"
kind = "data"
command = ["julia", "--project=.", "scripts/prepare_satellite_inputs.jl"]
outputs = [
    "data/processed/hubei_gpm_hourly_2022_2024_full_aligned.csv",
    "data/processed/hubei_gsmap_hourly_2022_2024_full_aligned.csv",
]
note = "reads the Earth Engine exports in data/GEE_GPM_HUBEI/ and data/GEE_GSMAP_HUBEI/ (scripts/gee_export_*.js)"

[[step]]
id = "prep_fy4b"
kind = "data"
