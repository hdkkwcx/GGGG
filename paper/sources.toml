# RQ2: hourly evaluation on the matched sample (`all_products`: the gauge and all three products finite).

[[table]]
name = "rq2_classes"
label = "RQ2 text: scores by intensity class, season and relief"
step = "rq2"
source = "output/satellite_temporal_evaluation_fy4bw3h0_gpmuncal_from202206_block7d/intensity_class_metrics.csv"
provenance = ["output/satellite_temporal_evaluation_fy4bw3h0_gpmuncal_from202206_block7d/provenance.csv"]
keys = ["product", "season", "region", "gauge_class"]
[table.where]
sample = "all_products"
region = ["all", "relief_lt500", "relief_500_1000"]
[table.values]
RB0 = ["RB_pct", "+0f"]
POD = ["POD_rain", "pct0"]
hit = ["class_hit", "pct0"]
# At >= 8 mm/h (the rainstorm and severe classes), all seasons, all three products.
[table.stats.loss_heavy]
stat = "range"
abs = true
column = "RB_pct"
fmt = "0f"
where = { product = ["FY4B", "GPM_uncal", "GSMaP"], season = "all", region = "all", gauge_class = ["rainstorm", "severe_rainstorm"] }
[table.stats.hit_heavy_max]
stat = "max"
column = "class_hit"
fmt = "pct0"
where = { product = ["FY4B", "GPM_uncal", "GSMaP"], season = "all", region = "all", gauge_class = ["rainstorm", "severe_rainstorm"] }
# The largest class-bias difference between relief below 500 m and 500-1000 m, per product and class.
[table.stats.relief_gap_max]
stat = "maxgap"
column = "RB_pct"
fmt = "0f"
key = "region"
a = "relief_lt500"
b = "relief_500_1000"
by = ["product", "gauge_class"]
where = { product = ["FY4B", "GPM_uncal", "GSMaP"], season = "all", gauge_class = ["light", "moderate", "heavy", "rainstorm", "severe_rainstorm"] }

