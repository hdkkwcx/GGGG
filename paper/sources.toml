# How each output above is made: the dependency graph `scripts/make_paper.jl` walks. Every entry
# names its `step`. A step's `command` runs from the repository root ("julia" is the running Julia,
# "python" the interpreter make_paper.jl resolves). An analysis or figure step is reused while its
# `marker` exists and, when the marker is a provenance file, records a clean tree and unchanged
# inputs. Data steps write `data/`, so make_paper.jl only checks their `outputs` and prints their
# command; it never runs them. `note` records what the command alone does not reproduce.
# `reviewed` is a commit up to which code changes since a step's run were checked and found not to
# move its result (make_paper.jl reports later ones as CHANGED); bump it only after such a review.

[[step]]
id = "prep_satellite"
kind = "data"
command = ["julia", "--project=.", "scripts/prepare_satellite_inputs.jl"]
outputs = [
    "data/processed/hubei_gpm_hourly_2022_2024_full_aligned.csv",
    "data/processed/hubei_gsmap_hourly_2022_2024_full_aligned.csv",
]
note = "reads the Earth Engine exports in data/GEE_GPM_HUBEI/ and data/GEE_GSMAP_HUBEI/ (scripts/gee_export_*.js)"

[[step]]
id = "prep_fy4b"
kind = "data"
command = ["julia", "--project=.", "scripts/prepare_fy4b_full_year.jl"]
outputs = ["data/processed/hubei_fy4b_hourly_2022_2024_full_strict_navcorrected.csv"]
note = "reads the FY4B files in data/FY4B/"

[[step]]
id = "raw_fy4b"
kind = "data"
command = []
outputs = ["data/FY4B"]
note = """no tracked script downloads them (NSMC's FengYun data service). FY-4B AGRI L2 QPE, \
full disk, 4 km, one file per 15-min scan (`..._L2-_QPE-_MULT_NOM_<start>_<end>_4000M_V0001.NC`), \
2022-2024, on the external drive at /Volumes/T9/FY4B and linked as data/FY4B. The 1-, 3- and 24-h \
QPE files are corrected with China's rain gauges and are never read."""

[[step]]
id = "raw_fy4b_clt"
kind = "data"
command = []
outputs = ["data/FY4B_CLT"]
note = """no tracked script downloads them (NSMC's FengYun data service). FY-4B AGRI L2 CLT (cloud \
type), full disk, 4 km, every 15 min, July 2023 only, on the external drive at /Volumes/T9/CLT and \
linked as data/FY4B_CLT. Kept out of data/FY4B, where the QPE reader would take each file for a \
duplicate of its QPE quarter."""

[[step]]
id = "prep_study_area"
kind = "data"
command = ["julia", "--project=.", "scripts/prepare_study_area_inputs.jl"]
outputs = [
    "data/processed/study_area/station_meta.csv",
    "data/processed/study_area/hubei_obs_hourly_2022_2025_JunSep.csv",
    "data/processed/study_area/hubei_gpm_hourly_2022_2024_full_aligned.csv",
    "data/processed/study_area/hubei_gsmap_hourly_2022_2024_full_aligned.csv",
    "data/processed/study_area/hubei_fy4b_hourly_2022_2024_full_strict_navcorrected.csv",
]
needs = ["prep_satellite", "prep_fy4b"]
note = "reads the gauge files data/hubei_station_meta.csv and data/hubei_obs_hourly_2022_2025_JunSep.csv"

[[step]]
id = "prep_gpm_uncal"
kind = "data"
command = ["julia", "--project=.", "scripts/prepare_gpm_uncal_inputs.jl"]
outputs = ["data/processed/study_area/hubei_gpm_uncal_hourly_2022_2024_full_aligned.csv"]
needs = ["prep_gpm_uncal_stations"]

[[step]]
id = "prep_gpm_uncal_stations"
kind = "data"
command = ["julia", "--project=.", "scripts/prepare_gpm_uncal_stations.jl"]
outputs = ["output/gpm_imerg_uncal_stations_2022_2024"]
needs = ["raw_imerg_uncal"]
note = """rebuilt 2026-10-22; through prep_gpm_uncal it reproduces the prepared study-area file byte for byte. \
Caveat (checked 2026-10-22): 73 of the 237 study gauges sit on a 0.1 deg cell edge, and at 49 of them \
this series reads a neighbouring pixel of the one Earth Engine read for IMERG Final (GPM): Earth \
Engine took the southern and/or western cell (south 33, west 13, south-west 3). Identified by the \
calibrated/uncalibrated ratio, which is near-constant within a month only at the matching pixel \
(median spread 0.011 there vs 0.414 at this series' pixel; 0.008 at interior gauges). Neither pixel \
is wrong, the gauge lies on their edge, but gauge-level comparisons of GPM_uncal with GPM (and \
merges with the Earth Engine products) mix in the pixel choice at those 49 gauges. Reproduced, and \
its numbers asserted, by scripts/verify_imerg_pixel_agreement.jl (tables in output/imerg_pixel_agreement/)."""

[[step]]
id = "raw_imerg_uncal"
kind = "data"
command = []
outputs = ["data/raw/gpm_imerg_v07_uncal_hubei_2022_2024"]
note = """no tracked script downloads them (an Earthdata login is needed). Each file's `history` \
attribute holds its request: NASA GES DISC OPeNDAP, collection C2723754847-GES_DISC \
(GPM_3IMERGHH.07, IMERG V07B Final half-hourly), granule <name>.HDF5.nc4, constraint \
/Grid/Intermediate/precipitationUncal[0:1:0][2886:1:2960][1192:1:1232] (cell centres lon \
108.65-116.05, lat 29.25-33.25), every half hour of 2022-01-01 to 2024-12-31 UTC"""

