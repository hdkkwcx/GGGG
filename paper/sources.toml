# RQ2: hourly evaluation over the full 2022-2024 record (IMERG Uncal run without FY4B).

[[table]]
name = "rq2_classes"
label = "RQ2 text: scores by intensity class, season and relief"
source = "output/satellite_temporal_evaluation_nofy4b_gpmuncal/intensity_class_metrics.csv"
provenance = ["output/satellite_temporal_evaluation_nofy4b_gpmuncal/provenance.csv"]
keys = ["product", "season", "region", "gauge_class"]
[table.where]
sample = "gpm_gsmap_full"
region = ["all", "relief_lt500", "relief_500_1000"]
[table.values]
RB0 = ["RB_pct", "+0f"]
POD = ["POD_rain", "pct0"]
hit = ["class_hit", "pct0"]
# At >= 8 mm/h (the rainstorm and severe classes), all seasons, both products.
[table.stats.loss_heavy]
stat = "range"
abs = true
column = "RB_pct"
fmt = "0f"
where = { product = ["GPM_uncal", "GSMaP"], season = "all", region = "all", gauge_class = ["rainstorm", "severe_rainstorm"] }
[table.stats.hit_heavy_max]
stat = "max"
column = "class_hit"
fmt = "pct0"
where = { product = ["GPM_uncal", "GSMaP"], season = "all", region = "all", gauge_class = ["rainstorm", "severe_rainstorm"] }
# The largest class-bias difference between relief below 500 m and 500-1000 m, per product and class.
[table.stats.relief_gap_max]
stat = "maxgap"
column = "RB_pct"
fmt = "0f"
key = "region"
a = "relief_lt500"
b = "relief_500_1000"
by = ["product", "gauge_class"]
where = { product = ["GPM_uncal", "GSMaP"], season = "all", gauge_class = ["light", "moderate", "heavy", "rainstorm", "severe_rainstorm"] }

[[table]]
name = "rq2_events"
label = "RQ2 text: rain-event detection and timing"
source = "output/satellite_temporal_evaluation_nofy4b_gpmuncal/event_timing_summary.csv"
provenance = ["output/satellite_temporal_evaluation_nofy4b_gpmuncal/provenance.csv"]
keys = ["product", "event_class"]
[table.where]
sample = "gpm_gsmap_full"
season = "all"
region = "all"
min_dry_gap_h = "3"
event_class = ["moderate", "heavy", "rainstorm", "severe_rainstorm"]
[table.values]
POD = ["POD_event", "pct0"]
centroid = ["median_centroid_error_h", "1f"]
[table.stats.pod]
stat = "range"
column = "POD_event"
fmt = "pct0"
where = { product = ["GPM_uncal", "GSMaP"] }
[table.stats.centroid_min]
stat = "min"
column = "median_centroid_error_h"
fmt = "1f"
where = { product = ["GPM_uncal", "GSMaP"] }
[table.stats.centroid_max]
stat = "max"
column = "median_centroid_error_h"
fmt = "1f"
where = { product = ["GPM_uncal", "GSMaP"] }

[[table]]
name = "rq2_areal"
label = "RQ2 text: areal-mean series"
source = "output/satellite_temporal_evaluation_nofy4b_gpmuncal/regional_series_metrics.csv"
provenance = ["output/satellite_temporal_evaluation_nofy4b_gpmuncal/provenance.csv"]
