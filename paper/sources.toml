[table.stats.pod]
stat = "range"
column = "POD_event"
fmt = "pct0"
where = { product = ["GPM_uncal", "GSMaP"] }
[table.stats.pod_fy4b]
stat = "range"
column = "POD_event"
fmt = "pct0"
where = { product = "FY4B" }
[table.stats.centroid_min]
