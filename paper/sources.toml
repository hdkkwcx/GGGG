# Numbers the paper cites. `scripts/export_paper_numbers.py` writes each block to
# paper/numbers/<name>.json, which paper_plan.typ reads; the check re-exports them and fails on any
# difference. `values` maps an output name to [source column, format]: Nf decimals (+Nf signed),
# or pct1 / pct0, a fraction as a signed percentage. Every block reads an IMERG Uncal run.

[[table]]
name = "methods_uncal"
label = "Table 3 and RQ3 text: pooled metrics and frequency bias (IMERG Uncal)"
step = "fusion"
source = "output/gauge_satellite_fusion_nofy4b_gpmuncal_block7d/method_summary.csv"
provenance = [
    "output/gauge_satellite_fusion_nofy4b_gpmuncal_block7d/source_provenance.csv",
    "output/interpolation_benchmark_full_joint_covariates_nested_mgwrintercept_only_satwetblend_blendagrenv_fusedanchor_nofy4b_gpmuncal/benchmark_scope.csv",
]
keys = ["product", "method"]
[table.where]
scheme = "balanced_spatial"
method = ["adw", "idw", "tps", "gwr", "raw", "mgwr", "blend_agrenv_mgwr"]
[table.values]
RMSE = ["RMSE", "3f"]
r = ["r", "3f"]
CSI2 = ["CSI_2.0", "3f"]
vs_raw = ["RMSE_improvement_vs_raw", "pct1"]
vs_adw = ["RMSE_improvement_vs_adw", "pct1"]
FBI8 = ["FBI_8.0", "2f"]
FBI20 = ["FBI_20.0", "2f"]
vs_raw0 = ["RMSE_improvement_vs_raw", "pct0"]
vs_adw0 = ["RMSE_improvement_vs_adw", "pct0"]

[[table]]
name = "vs_adw_uncal"
label = "RQ3 text: bootstrap comparisons with ADW (IMERG Uncal)"
step = "fusion"
source = "output/gauge_satellite_fusion_nofy4b_gpmuncal_block7d/fusion_vs_gauge_only.csv"
provenance = [
    "output/gauge_satellite_fusion_nofy4b_gpmuncal_block7d/source_provenance.csv",
    "output/interpolation_benchmark_full_joint_covariates_nested_mgwrintercept_only_satwetblend_blendagrenv_fusedanchor_nofy4b_gpmuncal/benchmark_scope.csv",
]
keys = ["product", "method", "stratum"]
[table.where]
method = ["mgwr", "blend_agrenv_mgwr"]
[table.values]
change = ["relative_improvement", "pct1"]
p_holm = ["pvalue_holm_family", "2f"]

[[table]]
name = "strata_uncal"
label = "RQ3 text: gain over ADW and mean bias by intensity and distance (IMERG Uncal)"
step = "fusion"
source = "output/gauge_satellite_fusion_nofy4b_gpmuncal_block7d/stratified_summary.csv"
provenance = [
    "output/gauge_satellite_fusion_nofy4b_gpmuncal_block7d/source_provenance.csv",
    "output/interpolation_benchmark_full_joint_covariates_nested_mgwrintercept_only_satwetblend_blendagrenv_fusedanchor_nofy4b_gpmuncal/benchmark_scope.csv",
]
